name: ALMA Monitor Container Check
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Cloud Run container
        run: docker build --tag alma-monitor:check .
      - name: Run watcher and registry tests
        run: |
          docker run --rm \
            --volume "$PWD:/src:ro" \
            --workdir /src \
            alma-monitor:check \
            python -m unittest discover -s tests -v

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Validate the Cloud configuration
        working-directory: infra
        run: |
          terraform init -backend=false
          terraform validate
